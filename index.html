<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SimCoach</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:#0d0d0d;color:#b0b8c8;font-size:12px}
#app{display:flex;height:100vh}

/* ── SIDEBAR ── */
#sb{width:220px;min-width:180px;background:#111318;border-right:1px solid #1e2330;
  display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
#sb-top{padding:10px 12px 8px;border-bottom:1px solid #1e2330}
.logo{font-size:14px;font-weight:900;color:#e0e8f0;letter-spacing:-.03em}
.logo b{color:#00aaff}
#sb-upload{padding:8px 10px;border-bottom:1px solid #1e2330;display:flex;flex-direction:column;gap:4px}
.ubtn{padding:5px 8px;border-radius:5px;border:none;font-size:11px;font-weight:600;
  cursor:pointer;font-family:inherit;width:100%;text-align:left;transition:.15s}
.ubtn-blue{background:#1a3a6b;color:#60aaff}.ubtn-blue:hover{background:#1e4480}
.ubtn-ghost{background:transparent;border:1px solid #1e2330;color:#607080}.ubtn-ghost:hover{background:#1a2030}
#ref-status{font-size:10px;color:#f59e0b;padding:2px 0;word-break:break-all}
#sb-laps{flex:1;overflow-y:auto;padding:6px 0}
.sb-title{padding:4px 12px;font-size:10px;color:#404858;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.lap-row{display:flex;align-items:center;gap:6px;padding:3px 10px;cursor:pointer;transition:.15s;user-select:none}
.lap-row:hover{background:#161c26}
.lap-check{width:13px;height:13px;border-radius:2px;border:1px solid #2a3444;cursor:pointer;flex-shrink:0;appearance:none;-webkit-appearance:none;position:relative;transition:.15s}
.lap-check:checked::after{content:'';position:absolute;inset:2px;border-radius:1px}
.lap-label{font-family:monospace;font-size:11px;flex:1;color:#7080a0}
.lap-time{font-family:monospace;font-size:11px;color:#7080a0;text-align:right}
.lap-row.active .lap-label,.lap-row.active .lap-time{color:#c8d8e8;font-weight:600}
.lap-ref-row{display:flex;align-items:center;gap:6px;padding:3px 10px 6px;cursor:pointer;border-bottom:1px solid #1e2330;margin-bottom:4px}
.lap-ref-row:hover{background:#161c26}
.lap-quick{display:flex;gap:3px;padding:4px 10px;border-top:1px solid #1e2330}
.qbtn{flex:1;padding:3px;border-radius:4px;border:1px solid #1e2330;background:transparent;
  color:#506070;font-size:10px;cursor:pointer;font-family:inherit;transition:.15s}
.qbtn:hover{background:#1a2030;color:#c0d0e0}

/* ── CONTENT ── */
#content{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#sess-bar{padding:6px 14px;border-bottom:1px solid #1e2330;background:#0f1219;
  display:none;flex-shrink:0}
#sess-bar.show{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.sess-title{font-size:13px;font-weight:700;color:#d0d8e8}
.sess-meta{font-size:11px;color:#404858}
.stat-pill{background:#161c26;border:1px solid #1e2330;border-radius:5px;padding:3px 10px;font-family:monospace;font-size:11px}
.stat-pill span{color:#7080a0;font-size:10px;margin-right:4px}

/* ── CHARTS ── */
#charts-wrap{flex:1;overflow-y:auto;overflow-x:hidden}
.cpanel{position:relative;border-bottom:1px solid #181e28;flex-shrink:0}
.cpanel-lbl{position:absolute;left:48px;top:4px;font-size:9px;color:#404858;
  text-transform:uppercase;letter-spacing:.07em;font-weight:700;pointer-events:none;z-index:2}
.cpanel canvas{display:block;width:100%!important}

/* ── ZONES / COACH ── */
#analysis{padding:12px 16px;border-top:1px solid #1e2330;background:#0d0d0d;display:none;flex-shrink:0}
#analysis.show{display:block}
.az-title{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#404858;font-weight:700;margin-bottom:6px}
.zone{display:grid;grid-template-columns:20px 1fr auto;gap:6px;align-items:center;
  background:#111318;border-left:2px solid #cc3333;padding:5px 8px;margin-bottom:4px;border-radius:0 5px 5px 0}
.zone-n{color:#cc3333;font-weight:900;font-family:monospace;font-size:13px}
.zone-loc{font-size:10px;color:#404858}
.zone-det{font-size:11px}
.zone-loss{font-family:monospace;font-weight:700;color:#cc3333;font-size:12px}
.coach-box{background:#111318;border:1px solid #1e2330;border-radius:6px;margin-bottom:8px}
.coach-hd{padding:6px 10px;border-bottom:1px solid #1e2330;font-size:10px;color:#404858;text-transform:uppercase;letter-spacing:.07em}
.coach-bd{padding:10px 12px;line-height:1.75;color:#404858;font-style:italic;min-height:50px;font-size:12px}
.coach-bd.on{color:#b0b8c8;font-style:normal}
.coach-bd strong{color:#d0d8e8}
.abtn{padding:6px 14px;border-radius:5px;border:none;background:#1a3a6b;color:#60aaff;
  font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.abtn:hover{background:#1e4480}
.abtn:disabled{opacity:.4;cursor:not-allowed}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:#0d0d0d}
::-webkit-scrollbar-thumb{background:#1e2330;border-radius:2px}

.lang-btn{padding:5px 12px;border:none;background:transparent;color:#405060;font-size:11px;
  font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.lang-btn.active{background:#1a3a6b;color:#60aaff}
.lang-btn:hover:not(.active){background:#161c26;color:#7090a0}

.metric-card{background:#111318;border:1px solid #1e2330;border-radius:6px;padding:8px 10px}
.metric-lbl{font-size:10px;color:#405060;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
.metric-val{font-size:18px;font-weight:700;font-family:monospace;margin-bottom:4px}
.metric-bar-bg{height:4px;background:#1e2330;border-radius:2px;overflow:hidden}
.metric-bar-fill{height:100%;border-radius:2px;transition:width .4s}
.metric-note{font-size:10px;color:#405060;margin-top:3px}

.coach-section{background:#111318;border:1px solid #1e2330;border-radius:6px;
  margin-bottom:6px;overflow:hidden}
.cs-header{display:flex;align-items:center;gap:8px;padding:7px 10px;
  border-bottom:1px solid #1e2330;background:#141a24}
.cs-icon{font-size:14px}
.cs-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#6080a0}
.cs-body{padding:10px 12px;font-size:12px;line-height:1.75;color:#b0b8c8}
.cs-body strong{color:#d8e0f0}
.cs-body .highlight{color:#00eeff;font-weight:600}
.cs-body .warning{color:#ffee00;font-weight:600}
.cs-body .danger{color:#ff4444;font-weight:600}
.cs-body .good{color:#00ff55;font-weight:600}
.priority-item{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;
  padding:7px 10px;background:#0d1017;border-radius:5px;border-left:2px solid #1e2330}
.priority-num{font-size:16px;font-weight:900;font-family:monospace;min-width:20px}
.p1{color:#ff4444;border-color:#ff4444}
.p2{color:#ffaa00;border-color:#ffaa00}
.p3{color:#ffee00;border-color:#ffee00}


/* ── AI Analysis ── */
.ai-controls{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.lang-toggle{display:flex;border:1px solid #1e2330;border-radius:5px;overflow:hidden}
.lang-btn{padding:5px 12px;border:none;background:transparent;color:#607080;
  font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.lang-btn.on{background:#1a3a6b;color:#60aaff}
.ai-result{display:none}
.ai-result.show{display:block}

/* Resumo em texto */
.ai-summary{background:#111318;border:1px solid #1e2330;border-left:3px solid #00aaff;
  border-radius:0 6px 6px 0;padding:10px 14px;margin-bottom:10px;
  font-size:12px;line-height:1.8;color:#b0b8c8}
.ai-summary strong{color:#e0e8f0}
.ai-summary em{color:#00aaff;font-style:normal;font-weight:600}

/* Métricas dashboard */
.ai-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;margin-bottom:10px}
.ai-metric{background:#111318;border:1px solid #1e2330;border-radius:6px;padding:8px 12px;text-align:center}
.ai-metric-val{font-size:22px;font-weight:900;font-family:monospace;letter-spacing:-.04em}
.ai-metric-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#405060;margin-top:2px}
.score-ring{display:inline-flex;align-items:center;justify-content:center;
  width:44px;height:44px;border-radius:50%;border:3px solid;font-size:16px;font-weight:900;font-family:monospace}

/* Secções estruturadas */
.ai-sections{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.ai-section{background:#111318;border:1px solid #1e2330;border-radius:6px;overflow:hidden}
.ai-section-hd{padding:6px 12px;border-bottom:1px solid #1e2330;font-size:10px;
  font-weight:700;text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:6px}
.ai-section-bd{padding:8px 12px;font-size:12px;line-height:1.75;color:#b0b8c8}
.ai-section-bd ul{margin:4px 0 0 14px}
.ai-section-bd li{margin-bottom:3px}
.ai-section-bd strong{color:#e0e8f0}
.priority-item{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:1px solid #1a2030}
.priority-item:last-child{border-bottom:none}
.priority-num{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:900;flex-shrink:0;margin-top:1px}
.priority-txt{flex:1;font-size:12px;line-height:1.6}
.priority-gain{font-family:monospace;font-size:11px;color:#ff6b6b;font-weight:700;white-space:nowrap}

.ai-loading{display:flex;align-items:center;gap:8px;color:#405060;font-size:12px;padding:12px 0}
.ai-spinner{width:14px;height:14px;border:2px solid #1e2330;border-top-color:#00aaff;
  border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

</style>
</head>
<body>
<div id="app">

<!-- SIDEBAR -->
<div id="sb">
  <div id="sb-top"><div class="logo">Sim<b>Coach</b></div></div>
  <div id="sb-upload">
    <button class="ubtn ubtn-blue" onclick="triggerUpload('ibt')">+ Add IBT Files</button>
    <button class="ubtn ubtn-ghost" onclick="triggerUpload('csv')">📊 Add Reference CSV</button>
    <div id="ref-status"></div>
  </div>
  <div id="sb-laps">
    <div class="sb-title">Laps</div>
    <div id="lap-list"></div>
    <div class="lap-quick" id="lap-quick" style="display:none">
      <button class="qbtn" onclick="selAll()">All</button>
      <button class="qbtn" onclick="selNone()">None</button>
      <button class="qbtn" onclick="selTop(3)">Top3</button>
      <button class="qbtn" onclick="selTop(5)">Top5</button>
    </div>
  </div>
</div>

<!-- CONTENT -->
<div id="content">
  <div id="sess-bar">
    <div>
      <div class="sess-title" id="sess-title"></div>
      <div class="sess-meta" id="sess-meta"></div>
    </div>
    <div class="stat-pill"><span>BEST</span><b id="st-best" style="color:#00cc66"></b></div>
    <div class="stat-pill"><span>AVG</span><b id="st-avg"></b></div>
    <div class="stat-pill"><span>GAP</span><b id="st-gap" style="color:#f59e0b"></b></div>
    <div class="stat-pill"><span>σ</span><b id="st-std"></b></div>
  </div>

  <div id="charts-wrap">
    <div class="cpanel" style="height:180px"><div class="cpanel-lbl">Speed [km/h]</div><canvas id="c-speed" height="180"></canvas></div>
    <div class="cpanel" style="height:140px"><div class="cpanel-lbl">Throttle [%] / Brake [%] (neg)</div><canvas id="c-tb" height="140"></canvas></div>
    <div class="cpanel" style="height:100px"><div class="cpanel-lbl">Brake (Right) / Clutch (left)</div><canvas id="c-gear" height="100"></canvas></div>
    <div class="cpanel" style="height:130px"><div class="cpanel-lbl">Steering Wheel Angle [deg]</div><canvas id="c-steer" height="130"></canvas></div>
    <div class="cpanel" style="height:150px"><div class="cpanel-lbl">Lap Time Delta [s]</div><canvas id="c-delta" height="150"></canvas></div>
  </div>

  <div id="analysis">
    <div class="az-title">Loss Zones</div>
    <div id="zones"></div>

    <!-- ── AI COACHING ── -->
    <div class="az-title" style="margin-top:14px">AI Coaching</div>

    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap">
      <div style="display:flex;border:1px solid #1e2330;border-radius:5px;overflow:hidden">
        <button id="lang-pt" class="abtn" style="border-radius:0;background:#1a3a6b;color:#60aaff" onclick="setLang('pt')">PT</button>
        <button id="lang-en" class="abtn" style="border-radius:0;background:transparent;color:#607080;border:none" onclick="setLang('en')">EN</button>
      </div>
      <button class="abtn" id="btn-coach" onclick="doCoach()">🏁 Analisar com IA</button>
    </div>

    <!-- Loading -->
    <div id="ai-loading" style="display:none;align-items:center;gap:8px;color:#405060;font-size:12px;margin-bottom:8px">
      <div style="width:14px;height:14px;border:2px solid #1e2330;border-top-color:#00aaff;border-radius:50%;animation:spin .8s linear infinite"></div>
      <span id="ai-loading-txt">O engenheiro virtual está a analisar...</span>
    </div>

    <!-- Resultado -->
    <div id="ai-result" style="display:none">
      <div id="ai-metrics" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;margin-bottom:10px"></div>
      <div id="ai-summary" style="background:#111318;border:1px solid #1e2330;border-left:3px solid #00aaff;border-radius:0 6px 6px 0;padding:10px 14px;margin-bottom:10px;font-size:12px;line-height:1.8;color:#b0b8c8"></div>
      <div id="ai-sections"></div>
    </div>

</div>
  </div>
</div>
